<!-- src/app/components/agent/agent.component.html -->
<div class="agent-container" [class.minimized]="isMinimized">

  <!-- Bouton toggle (état minimisé) -->
  <div class="agent-toggle" (click)="toggleMinimize()" *ngIf="isMinimized">
    <img src="/images/agent-avatar.png" alt="Agent BNA" class="agent-avatar"
         (error)="onAvatarError($event)">
    <span class="agent-badge">●</span>
  </div>

  <!-- Fenêtre de chat -->
  <div class="agent-window" *ngIf="!isMinimized">

    <!-- Header -->
    <div class="agent-header">
      <div class="header-left">
        <img src="/images/agent-avatar.png" alt="Agent BNA" class="agent-avatar"
             (error)="onAvatarError($event)">
        <div class="agent-info">
          <span class="agent-name">Assistant BNA</span>
          <span class="agent-status">En ligne</span>
        </div>
      </div>
      <div class="header-actions">
        <button mat-icon-button (click)="clearChat()" title="Nettoyer le chat">
          <mat-icon>delete_outline</mat-icon>
        </button>
        <button mat-icon-button (click)="toggleMinimize()" title="Fermer">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" #chatContainer>
      <!-- Messages -->
      <div *ngFor="let msg of messages" class="message-wrapper">

        <!-- Message utilisateur -->
        <div *ngIf="msg.isUser" class="message user-message">
          <div class="message-bubble">
            {{ msg.text }}
          </div>
          <div class="message-time">{{ msg.timestamp | date:'HH:mm' }}</div>
        </div>

        <!-- Message agent -->
        <div *ngIf="!msg.isUser" class="message agent-message">
          <img src="/images/agent-avatar.png" alt="Agent" class="msg-avatar"
               (error)="onAvatarError($event)">
          <div class="message-content">
            <div class="message-bubble" [innerHTML]="msg.text | nl2br"></div>
            <div class="message-time">{{ msg.timestamp | date:'HH:mm' }}</div>

            <!-- Bouton d'action -->
            <button *ngIf="msg.action"
                    mat-raised-button
                    color="primary"
                    (click)="navigateTo(msg.action!.data)"
                    class="action-button">
              {{ msg.action.label }}
            </button>
          </div>
        </div>

      </div>

      <!-- Indicateur de saisie -->
      <div *ngIf="isTyping" class="message agent-message typing-container">
        <img src="/images/agent-avatar.png" alt="Agent" class="msg-avatar"
             (error)="onAvatarError($event)">
        <div class="typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <!-- Suggestions rapides -->
    <div class="quick-suggestions">
      <button *ngFor="let suggestion of quickSuggestions"
              mat-stroked-button
              (click)="useSuggestion(suggestion.message)">
        {{ suggestion.label }}
      </button>
    </div>

    <!-- Zone de saisie -->
    <div class="chat-input">
      <input type="text"
             [(ngModel)]="userInput"
             (keyup.enter)="sendMessage()"
             placeholder="Posez votre question..."
             class="input-field">
      <button mat-raised-button
              color="primary"
              (click)="sendMessage()"
              [disabled]="!userInput.trim()">
        <mat-icon>send</mat-icon>
      </button>
    </div>
  </div>
</div>
