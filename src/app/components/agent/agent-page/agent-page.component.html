<!-- src/app/components/agent/agent-page/agent-page.component.html -->
<div class="agent-page-container">

  <!-- Header -->
  <div class="agent-page-header">
    <button class="back-button" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
      Retour
    </button>
    <div class="header-info">
      <img src="/images/agent-avatar.png" alt="Agent" class="header-avatar"
           (error)="onAvatarError($event)">
      <div>
        <h1>Assistant BNA</h1>
        <span class="status">En ligne</span>
      </div>
    </div>
    <button class="clear-button" (click)="clearChat()" title="Nettoyer le chat">
      <mat-icon>delete_outline</mat-icon>
    </button>
  </div>

  <!-- Messages -->
  <div class="chat-messages" #chatContainer>
    <div *ngFor="let msg of messages" class="message-wrapper">

      <!-- Message utilisateur -->
      <div *ngIf="msg.isUser" class="message user-message">
        <div class="message-bubble">
          {{ msg.text }}
        </div>
        <div class="message-time">{{ msg.timestamp | date:'HH:mm' }}</div>
      </div>

      <!-- Message agent -->
      <div *ngIf="!msg.isUser" class="message agent-message">
        <img src="/images/agent-avatar.png" alt="Agent" class="msg-avatar"
             (error)="onAvatarError($event)">
        <div class="message-content">
          <div class="message-bubble" [innerHTML]="msg.text | nl2br"></div>
          <div class="message-time">{{ msg.timestamp | date:'HH:mm' }}</div>

          <button *ngIf="msg.action"
                  mat-raised-button
                  color="primary"
                  (click)="navigateTo(msg.action!.data)"
                  class="action-button">
            {{ msg.action.label }}
          </button>
        </div>
      </div>

    </div>

    <!-- Indicateur de saisie -->
    <div *ngIf="isTyping" class="message agent-message typing-container">
      <img src="/images/agent-avatar.png" alt="Agent" class="msg-avatar"
           (error)="onAvatarError($event)">
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Suggestions rapides -->
  <div class="quick-suggestions">
    <button *ngFor="let suggestion of quickSuggestions"
            mat-stroked-button
            (click)="useSuggestion(suggestion.message)">
      {{ suggestion.label }}
    </button>
  </div>

  <!-- Zone de saisie -->
  <div class="chat-input">
    <input type="text"
           [(ngModel)]="userInput"
           (keyup.enter)="sendMessage()"
           placeholder="Posez votre question..."
           class="input-field">
    <button mat-raised-button
            color="primary"
            (click)="sendMessage()"
            [disabled]="!userInput.trim()">
      <mat-icon>send</mat-icon>
    </button>
  </div>

</div>
