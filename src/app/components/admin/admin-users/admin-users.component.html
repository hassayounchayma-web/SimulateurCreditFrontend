<h1>Utilisateurs</h1>
<div *ngIf="loading">Chargement…</div>
<div class="error" *ngIf="error">{{ error }}</div>

<div class="table-wrap" *ngIf="!loading && users.length">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Email</th>
        <th>CIN</th>
        <th>Téléphone</th>
        <th>Rôle</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of users">
        <td>{{ u.id }}</td>
        <td>{{ u.prenom }} {{ u.nom }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.cin }}</td>
        <td>{{ u.telephone }}</td>
        <td><span class="badge" [class.admin]="u.role === 'ADMIN'">{{ u.role }}</span></td>
      </tr>
    </tbody>
  </table>
</div>
